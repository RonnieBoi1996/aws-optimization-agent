[project]
name = "optimizer"
version = "0.1.0"
description = "Multi-agent AWS optimizer that proposes cost/IAM/latency changes as Terraform PRs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "boto3>=1.44.11",
    "langgraph>=1.2.24",
    "mcp>=2.3.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.4",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0.4",
]

[project.scripts]
optimizer = "optimizer:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[cloudwatch,ec2,s3,sts]>=5.2.6",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# ci/ holds stdlib-only scripts that run in GitHub Actions; tests import them directly.
pythonpath = ["ci"]
testpaths = ["tests"]
